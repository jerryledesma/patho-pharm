<text text-anchor="start" x="779" y="-300.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">Metabolic ACIDOSIS</text>
<text text-anchor="start" x="752" y="-289.2" font-family="Helvetica,sans-Serif" font-size="11.00">pH ↓ &#160;HCO3&#45; ↓ &#160;(PaCO2 normal)</text>
<text text-anchor="start" x="761" y="-278.2" font-family="Helvetica,sans-Serif" font-size="11.00">Too much acid OR lost bicarb</text>
<text text-anchor="start" x="711.5" y="-267.2" font-family="Helvetica,sans-Serif" font-size="11.00">ACIDS: lactic Acidosis/sepsis, Chronic diarrhea,</text>
<text text-anchor="start" x="720" y="-256.2" font-family="Helvetica,sans-Serif" font-size="11.00">Impaired renal, DKA (+ salicylate ingestion)</text>
<text text-anchor="start" x="707.5" y="-245.2" font-family="Helvetica,sans-Serif" font-size="11.00">S/S: Kussmaul (deep, rapid), headache, lethargy</text>
<text text-anchor="start" x="709.5" y="-234.2" font-family="Helvetica,sans-Serif" font-size="11.00">Tx: LR (lactate→HCO3&#45;), NaHCO3 only if severe</text>
<text text-anchor="start" x="741.5" y="-223.2" font-family="Helvetica,sans-Serif" font-size="11.00">Lungs: hyperventilate, blow off CO2</text>
</g>
