<text text-anchor="start" x="536.5" y="-160.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">Electrolyte shifts (H+ swaps with K+ and Ca++)</text>
<text text-anchor="start" x="411" y="-149.2" font-family="Helvetica,sans-Serif" font-size="11.00">ACIDOSIS: H+ into cell, K+ out → HYPERkalemia · H+ takes albumin, Ca++ freed → HYPERcalcemia</text>
<text text-anchor="start" x="440" y="-138.2" font-family="Helvetica,sans-Serif" font-size="11.00">ALKALOSIS: H+ out of cell, K+ in → HYPOkalemia · Ca++ binds albumin → HYPOcalcemia</text>
<text text-anchor="start" x="558" y="-127.2" font-family="Helvetica,sans-Serif" font-size="11.00">Hyper/hyper · Hypo/hypo → monitor EKG (K+)</text>
</g>
