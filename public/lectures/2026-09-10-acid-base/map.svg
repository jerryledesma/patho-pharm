<text text-anchor="start" x="457" y="-300.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">Respiratory ALKALOSIS</text>
<text text-anchor="start" x="440" y="-289.2" font-family="Helvetica,sans-Serif" font-size="11.00">pH ↑ &#160;PaCO2 ↓ &#160;(HCO3&#45; normal)</text>
<text text-anchor="start" x="441.5" y="-278.2" font-family="Helvetica,sans-Serif" font-size="11.00">HYPERventilation → hypocapnia</text>
<text text-anchor="start" x="407.5" y="-267.2" font-family="Helvetica,sans-Serif" font-size="11.00">TACHYPNEA: Temp, Aspirin, Controlled vent,</text>
<text text-anchor="start" x="399" y="-256.2" font-family="Helvetica,sans-Serif" font-size="11.00">Hypervent, Yelp (anxiety/pain), Pneumothorax,</text>
<text text-anchor="start" x="443.5" y="-245.2" font-family="Helvetica,sans-Serif" font-size="11.00">Neuro, Embolism (PE), Altitude</text>
<text text-anchor="start" x="420.5" y="-234.2" font-family="Helvetica,sans-Serif" font-size="11.00">S/S: dizziness, tingling, tetany (low Ca)</text>
<text text-anchor="start" x="398" y="-223.2" font-family="Helvetica,sans-Serif" font-size="11.00">REST: Rebreather, Electrolytes, Sedative, Teach</text>
</g>
