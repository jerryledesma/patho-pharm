<text text-anchor="start" x="1106.5" y="-300.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">Metabolic ALKALOSIS</text>
<text text-anchor="start" x="1084" y="-289.2" font-family="Helvetica,sans-Serif" font-size="11.00">pH ↑ &#160;HCO3&#45; ↑ &#160;(PaCO2 normal)</text>
<text text-anchor="start" x="1102.5" y="-278.2" font-family="Helvetica,sans-Serif" font-size="11.00">Lost acid OR gained base</text>
<text text-anchor="start" x="1041.5" y="-267.2" font-family="Helvetica,sans-Serif" font-size="11.00">Vomiting / NG suction (lose HCl), loop diuretics,</text>
<text text-anchor="start" x="1039.5" y="-256.2" font-family="Helvetica,sans-Serif" font-size="11.00">steroids, hypokalemia, antacids, dialysis lactate</text>
<text text-anchor="start" x="1021.5" y="-245.2" font-family="Helvetica,sans-Serif" font-size="11.00">S/S: weakness, cramps, tetany, confusion, tachycardia</text>
<text text-anchor="start" x="1060" y="-234.2" font-family="Helvetica,sans-Serif" font-size="11.00">Tx: NS, IV KCl ≤ 10 mEq/hr, recheck BMP</text>
<text text-anchor="start" x="1081.5" y="-223.2" font-family="Helvetica,sans-Serif" font-size="11.00">Lungs: hypoventilate, retain CO2</text>
</g>
