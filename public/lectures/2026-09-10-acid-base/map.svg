<text text-anchor="start" x="113.5" y="-300.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">Respiratory ACIDOSIS</text>
<text text-anchor="start" x="92" y="-289.2" font-family="Helvetica,sans-Serif" font-size="11.00">pH ↓ &#160;PaCO2 ↑ &#160;(HCO3&#45; normal)</text>
<text text-anchor="start" x="94" y="-278.2" font-family="Helvetica,sans-Serif" font-size="11.00">HYPOventilation → hypercapnia</text>
<text text-anchor="start" x="81" y="-267.2" font-family="Helvetica,sans-Serif" font-size="11.00">DEPRES: Drugs, Edema, Pneumonia,</text>
<text text-anchor="start" x="11" y="-256.2" font-family="Helvetica,sans-Serif" font-size="11.00">Resp alteration (stroke), Emphysema, Spasm (asthma/COPD)</text>
<text text-anchor="start" x="45.5" y="-245.2" font-family="Helvetica,sans-Serif" font-size="11.00">S/S: headache, blurred vision, restless→lethargy,</text>
<text text-anchor="start" x="101" y="-234.2" font-family="Helvetica,sans-Serif" font-size="11.00">warm flushed skin, RR ↓ late</text>
<text text-anchor="start" x="93" y="-223.2" font-family="Helvetica,sans-Serif" font-size="11.00">Kidneys: keep HCO3&#45;, dump H+</text>
</g>
